<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Morgan - Frontend Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 0 10%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid #222;
        }

        .my-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        .hire-me {
            background: #ffffff;
            color: #121212;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .hero-intro {
            padding: 100px 0 60px 0;
            max-width: 700px;
        }

        .hero-intro h1 {
            font-size: 52px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .hero-intro h1 span {
            color: #3b82f6;
        }

        .hero-intro p {
            font-size: 18px;
            color: #a0a0a0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .skills-tag {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: #1e1e1e;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #93c5fd;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="my-name">Alex.dev</div>
        <a href="#" class="hire-me">Contact Me</a>
    </header>

    <section class="hero-intro">
        <h1>Hi, I'm Alex. <span>Frontend Developer</span> & Designer.</h1>
        <p>I build exceptional and high-performing digital experiences, clean web interfaces, and modern applications with pixel-perfect precision.</p>
        
        <div class="skills-tag">
            <span class="tag">HTML5 / CSS3</span>
            <span class="tag">JavaScript</span>
            <span class="tag">React.js</span>
            <span class="tag">UI/UX Design</span>
        </div>
    </section>

</body>
</html>
