<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricPro - AI Data Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #0f172a;
            border-right: 1px solid #1e293b;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-area {
            font-size: 22px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            display: block;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: #10b981;
            color: #090d16;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .top-bar h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .user-profile {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #10b981;
            border: 1px solid #334155;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #111827;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #1f2937;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
        }

        .stat-card .trend {
            font-size: 12px;
            color: #10b981;
            margin-top: 5px;
        }

        .chart-section {
            background: #111827;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #1f2937;
        }

        .chart-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #f3f4f6;
        }

        .fake-chart {
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding-top: 20px;
            border-bottom: 2px solid #374151;
        }

        .bar {
            width: 12%;
            background: linear-gradient(to top, #059669, #10b981);
            border-radius: 6px 6px 0 0;
            transition: height 0.3s;
        }

        .bar:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">MetricPro.ai</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Overview</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">AI Reports</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
        <div style="font-size: 12px; color: #475569; text-align: center;">v2.4.0 Pro</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>Performance Dashboard</h1>
            <div class="user-profile">● Live System Online</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <div class="value">$84,290</div>
                <div class="trend">+14.2% from last month</div>
            </div>
            <div class="stat-card">
                <h3>Active Users</h3>
                <div class="value">14,320</div>
                <div class="trend">+8.1% growth rate</div>
            </div>
            <div class="stat-card">
                <h3>Conversion Rate</h3>
                <div class="value">4.68%</div>
                <div class="trend">+2.4% optimized</div>
            </div>
        </div>

        <div class="chart-section">
            <h2>Monthly Traffic & Engagement Metrics</h2>
            <div class="fake-chart">
                <div class="bar" style="height: 45%;"></div>
                <div class="bar" style="height: 65%;"></div>
                <div class="bar" style="height: 50%;"></div>
                <div class="bar" style="height: 85%;"></div>
                <div class="bar" style="height: 70%;"></div>
                <div class="bar" style="height: 95%;"></div>
            </div>
        </div>
    </div>

</body>
</html>
